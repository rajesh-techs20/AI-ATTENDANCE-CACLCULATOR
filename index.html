 <!DOCTYPE html>
 <html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI ATTENDANCE CALCULATOR</title>

  <link rel="stylesheet" href="style.css">
 </head>
 <body>
  <div class="container">
    <h1>AI ATTENDACE CALCULATOR</h1>
    
    <div class="card">
      <label>Number of classes Conducted</label>
      <input type="number" id="totalnumber">

      <label>Nhumber of Classes Attended</label>
      <input type="number" id="attended">

      <label>Target Attendance percentage</label>
      <input type="number" id="percent" placeholder="eg: 75">

      <button onclick="calculateAttendance()">Calculate</button>

      <div id="result"></div>
    </div>
  </div>
  <script src="script.js"></script>
  
 </body>
 </html>
